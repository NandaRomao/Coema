version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: coema_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coema_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coema_password}
      POSTGRES_DB: ${POSTGRES_DB:-coema_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
